[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-streaming-platform"
version = "0.1.0"
description = "Real-time S&P 500 Stock Streaming Platform"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = [
    "config*",
    "backend*",
    "frontend*",
]
