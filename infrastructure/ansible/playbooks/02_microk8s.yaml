---
- name: Install and Configure MicroK8s
  hosts: k8s_nodes
  become: true
  roles:
    - microk8s
  post_tasks:
    - name: Summary
      debug:
        msg: |
          ✅ MicroK8s installed and configured!
          
          Enabled addons: {{ microk8s_addons | join(', ') }}
          
          Useful commands:
            microk8s kubectl get nodes
            microk8s kubectl get pods -A
            microk8s status
