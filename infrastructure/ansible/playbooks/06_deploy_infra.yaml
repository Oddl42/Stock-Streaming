---
# ============================================================
# Deploy Infrastructure: Kafka, TimescaleDB, Spark
# ============================================================
- name: Deploy Infrastructure Components
  hosts: k8s_nodes
  become: true
  environment:
    KUBECONFIG: /var/snap/microk8s/current/credentials/client.config
  tasks:

    # ==========================================
    # 0. Prerequisites
    # ==========================================
    - name: Install standalone Helm
      shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm
      become: true

    # ==========================================
    # 0.5 Ensure Namespaces exist (NOT managed by Helm)
    # ==========================================
    - name: Ensure project namespace exists
      shell: >
        microk8s kubectl create namespace {{ project_namespace }}
        --dry-run=client -o yaml | microk8s kubectl apply -f -
      become: true
      changed_when: false
      tags: [kafka, timescaledb, spark]

    - name: Ensure kafka namespace exists
      shell: >
        microk8s kubectl create namespace kafka
        --dry-run=client -o yaml | microk8s kubectl apply -f -
      become: true
      changed_when: false
      tags: [kafka]

    # ==========================================
    # 1. Strimzi Kafka Operator
    # ==========================================
    - name: Adopt orphaned Strimzi RoleBindings for Helm
      shell: |
        for rb in strimzi-cluster-operator strimzi-cluster-operator-entity-operator-delegation strimzi-cluster-operator-watched strimzi-cluster-operator-leader-election; do
          microk8s kubectl annotate rolebinding -n kafka "$rb" \
            meta.helm.sh/release-name=strimzi-kafka-operator \
            meta.helm.sh/release-namespace=kafka \
            --overwrite 2>/dev/null || true
          microk8s kubectl label rolebinding -n kafka "$rb" \
            app.kubernetes.io/managed-by=Helm \
            --overwrite 2>/dev/null || true
        done
      become: true
      changed_when: false
      failed_when: false
      tags: [kafka]

    - name: Add Strimzi Helm repository
      kubernetes.core.helm_repository:
        name: strimzi
        repo_url: "https://strimzi.io/charts/"
      tags: [kafka]

    - name: Install Strimzi Kafka Operator
      kubernetes.core.helm:
        name: strimzi-kafka-operator
        chart_ref: strimzi/strimzi-kafka-operator
        release_namespace: kafka
        create_namespace: false
        wait: true
        wait_timeout: "5m"
        values:
          watchNamespaces:
            - kafka
      tags: [kafka]

    - name: Wait for Strimzi Operator to be ready
      command: >
        microk8s kubectl wait --for=condition=Ready
        pod -l name=strimzi-cluster-operator
        -n kafka --timeout=120s
      changed_when: false
      tags: [kafka]

    # ==========================================
    # 2. Deploy via Helm Chart (Kafka Cluster + Topics)
    # ==========================================
    - name: Adopt stock-platform namespace for Kafka Helm release
      shell: |
        microk8s kubectl annotate namespace {{ project_namespace }} \
          meta.helm.sh/release-name=stock-platform-kafka \
          meta.helm.sh/release-namespace={{ project_namespace }} \
          --overwrite 2>/dev/null || true
        microk8s kubectl label namespace {{ project_namespace }} \
          app.kubernetes.io/managed-by=Helm \
          --overwrite 2>/dev/null || true
      become: true
      changed_when: false
      failed_when: false
      tags: [kafka]

    - name: Deploy Stock Platform Helm Chart - Kafka Resources
      kubernetes.core.helm:
        name: stock-platform-kafka
        chart_ref: "{{ infrastructure_dir }}/helm/stock-platform"
        release_namespace: "{{ project_namespace }}"
        create_namespace: false
        wait: true
        wait_timeout: "10m"
        values_files:
          - "{{ infrastructure_dir }}/helm/stock-platform/values.yaml"
          - "{{ infrastructure_dir }}/helm/stock-platform/values-dev.yaml"
        set_values:
          - value: "timescaledb.enabled=false"
          - value: "spark.enabled=false"
          - value: "app.wsProducer.enabled=false"
          - value: "app.sparkJob.enabled=true"
          - value: "app.panelGui.enabled=false"
          - value: "monitoring.enabled=false"
      tags: [kafka]

    - name: Wait for Kafka Cluster to be ready
      command: >
        microk8s kubectl wait --for=condition=Ready
        kafka/kafka-cluster -n kafka --timeout=300s
      changed_when: false
      retries: 3
      delay: 30
      register: kafka_wait
      until: kafka_wait.rc == 0
      tags: [kafka]

    # ==========================================
    # 3. TimescaleDB
    # ==========================================
    - name: Re-adopt namespace for TimescaleDB Helm release
      shell: |
        microk8s kubectl annotate namespace {{ project_namespace }} \
          meta.helm.sh/release-name=stock-platform-tsdb \
          meta.helm.sh/release-namespace={{ project_namespace }} \
          --overwrite 2>/dev/null || true
      become: true
      changed_when: false
      failed_when: false
      tags: [timescaledb]

    - name: Pre-pull TimescaleDB images
      shell: |
        microk8s ctr image pull docker.io/timescale/timescaledb:latest-pg15 || true
        microk8s ctr image pull docker.io/prometheuscommunity/postgres-exporter:v0.15.0 || true
      become: true
      changed_when: false
      tags: [timescaledb]

    - name: Deploy Stock Platform Helm Chart - TimescaleDB
      kubernetes.core.helm:
        name: stock-platform-tsdb
        chart_ref: "{{ infrastructure_dir }}/helm/stock-platform"
        release_namespace: "{{ project_namespace }}"
        create_namespace: false
        wait: true
        wait_timeout: "15m"
        values_files:
          - "{{ infrastructure_dir }}/helm/stock-platform/values.yaml"
          - "{{ infrastructure_dir }}/helm/stock-platform/values-dev.yaml"
        set_values:
          - value: "kafka.enabled=false"
          - value: "spark.enabled=false"
          - value: "app.wsProducer.enabled=false"
          - value: "app.sparkJob.enabled=false"
          - value: "app.panelGui.enabled=false"
          - value: "monitoring.enabled=false"
      tags: [timescaledb]

    - name: Wait for TimescaleDB to be ready
      command: >
        microk8s kubectl wait --for=condition=Ready
        pod -l app=timescaledb
        -n {{ project_namespace }} --timeout=180s
      changed_when: false
      tags: [timescaledb]

    # ==========================================
    # 4. Spark Master + Workers
    # ==========================================
    - name: Re-adopt namespace for Spark Helm release
      shell: |
        microk8s kubectl annotate namespace {{ project_namespace }} \
          meta.helm.sh/release-name=stock-platform-spark \
          meta.helm.sh/release-namespace={{ project_namespace }} \
          --overwrite 2>/dev/null || true
      become: true
      changed_when: false
      failed_when: false
      tags: [spark]

    - name: Pre-pull Spark images
      shell: |
        microk8s ctr image pull docker.io/apache/spark:3.5.1 || true
      become: true
      changed_when: false
      timeout: 600
      tags: [spark]

    - name: Deploy Stock Platform Helm Chart - Spark
      kubernetes.core.helm:
        name: stock-platform-spark
        chart_ref: "{{ infrastructure_dir }}/helm/stock-platform"
        release_namespace: "{{ project_namespace }}"
        create_namespace: false
        wait: true
        wait_timeout: "15m"
        values_files:
          - "{{ infrastructure_dir }}/helm/stock-platform/values.yaml"
          - "{{ infrastructure_dir }}/helm/stock-platform/values-dev.yaml"
        set_values:
          - value: "kafka.enabled=false"
          - value: "timescaledb.enabled=false"
          - value: "app.wsProducer.enabled=false"
          - value: "app.sparkJob.enabled=false"
          - value: "app.panelGui.enabled=false"
          - value: "monitoring.enabled=false"
      tags: [spark]

    - name: Wait for Spark Master to be ready
      command: >
        microk8s kubectl wait --for=condition=Ready
        pod -l app=spark-master
        -n {{ project_namespace }} --timeout=120s
      changed_when: false
      tags: [spark]

    # ==========================================
    # 5. Verify all infrastructure
    # ==========================================
    - name: Verify all infrastructure pods
      command: "microk8s kubectl get pods -n {{ item }} -o wide"
      loop:
        - kafka
        - "{{ project_namespace }}"
      register: infra_pods
      changed_when: false

    - name: Display infrastructure pods
      debug:
        msg: "{{ item.stdout_lines }}"
      loop: "{{ infra_pods.results }}"
      loop_control:
        label: "{{ item.item }}"
