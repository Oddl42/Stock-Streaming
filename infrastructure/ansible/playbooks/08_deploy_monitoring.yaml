---
# ============================================================
# Deploy Monitoring: Prometheus + Grafana
# ============================================================
- name: Deploy Monitoring Stack
  hosts: k8s_nodes
  become: true
  tasks:

    - name: Deploy Stock Platform Helm Chart - Monitoring
      kubernetes.core.helm:
        name: stock-platform-monitoring
        chart_ref: "{{ infrastructure_dir }}/helm/stock-platform"
        release_namespace: "{{ project_namespace }}"
        wait: true
        wait_timeout: "5m"
        values_files:
          - "{{ infrastructure_dir }}/helm/stock-platform/values.yaml"
          - "{{ infrastructure_dir }}/helm/stock-platform/values-dev.yaml"
        set_values:
          - value: "kafka.enabled=false"
          - value: "timescaledb.enabled=false"
          - value: "spark.enabled=false"
          - value: "app.wsProducer.enabled=false"
          - value: "app.sparkJob.enabled=false"
          - value: "app.panelGui.enabled=false"
      tags: [monitoring]

    - name: Apply additional Prometheus scrape configs
      command: >
        microk8s kubectl apply -f -
      args:
        stdin: "{{ lookup('template', infrastructure_dir + '/helm/stock-platform/templates/monitoring/prometheus-config.yaml') }}"
      changed_when: false
      tags: [monitoring]

    - name: Display monitoring access information
      debug:
        msg: |
          ✅ Monitoring deployed!
          
          📊 Grafana:      http://localhost:{{ network.grafana_nodeport }}
             User:         {{ monitoring.grafana.admin_user }}
             Password:     {{ monitoring.grafana.admin_password }}
          
          📈 Prometheus:   (via MicroK8s addon, ClusterIP)
