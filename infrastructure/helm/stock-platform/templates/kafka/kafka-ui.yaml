{{- if and .Values.kafka.enabled .Values.kafka.ui .Values.kafka.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: kafka
  labels:
    app: kafka-ui
    {{- include "stock-platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "kafka-cluster"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
          resources:
            requests:
              memory: {{ .Values.kafka.ui.resources.requests.memory | default "256Mi" | quote }}
              cpu: {{ .Values.kafka.ui.resources.requests.cpu | default "100m" | quote }}
            limits:
              memory: {{ .Values.kafka.ui.resources.limits.memory | default "512Mi" | quote }}
              cpu: {{ .Values.kafka.ui.resources.limits.cpu | default "300m" | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: kafka
  labels:
    app: kafka-ui
spec:
  type: NodePort
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: {{ .Values.kafka.ui.nodePort | default 30008 }}
{{- end }}
