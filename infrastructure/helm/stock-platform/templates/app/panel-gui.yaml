{{- if .Values.app.panelGui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-gui
  namespace: {{ include "stock-platform.namespace" . }}
  labels:
    app: panel-gui
    {{- include "stock-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.panelGui.replicas }}
  selector:
    matchLabels:
      app: panel-gui
  template:
    metadata:
      labels:
        app: panel-gui
    spec:
      containers:
        - name: panel-gui
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.app.panelGui.image.repository }}:{{ .Values.app.panelGui.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 5006
              name: panel
          env:
            {{- include "stock-platform.commonEnv" . | nindent 12 }}
            - name: PANEL_PORT
              value: "5006"
            - name: PANEL_ADDRESS
              value: "0.0.0.0"
          resources:
            requests:
              memory: {{ .Values.app.panelGui.resources.requests.memory }}
              cpu: {{ .Values.app.panelGui.resources.requests.cpu }}
            limits:
              memory: {{ .Values.app.panelGui.resources.limits.memory }}
              cpu: {{ .Values.app.panelGui.resources.limits.cpu }}
          livenessProbe:
            httpGet:
              path: /app
              port: 5006
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /app
              port: 5006
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: panel-gui-service
  namespace: {{ include "stock-platform.namespace" . }}
  labels:
    app: panel-gui
spec:
  type: NodePort
  ports:
    - port: {{ .Values.app.panelGui.service.port }}
      targetPort: panel
      nodePort: {{ .Values.app.panelGui.service.nodePort }}
      name: panel
  selector:
    app: panel-gui
{{- end }}
