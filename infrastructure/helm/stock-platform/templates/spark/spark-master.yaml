{{- if .Values.spark.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: {{ include "stock-platform.namespace" . }}
  labels:
    app: spark-master
    {{- include "stock-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.spark.master.replicas }}
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: spark-master
          image: "{{ .Values.spark.image.repository }}:{{ .Values.spark.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /opt/spark/bin/spark-class
          args:
            - org.apache.spark.deploy.master.Master
            - --host
            - "0.0.0.0"
            - --port
            - "7077"
            - --webui-port
            - "8080"
          ports:
            - containerPort: 7077
              name: spark
            - containerPort: 8080
              name: web-ui
          env:
            - name: SPARK_MASTER_HOST
              value: "0.0.0.0"
            - name: SPARK_MASTER_PORT
              value: "7077"
            - name: SPARK_MASTER_WEBUI_PORT
              value: "8080"
            - name: SPARK_DAEMON_MEMORY
              value: "512m"
            - name: SPARK_HOME
              value: "/opt/spark"
          resources:
            requests:
              memory: {{ .Values.spark.master.resources.requests.memory }}
              cpu: {{ .Values.spark.master.resources.requests.cpu }}
            limits:
              memory: {{ .Values.spark.master.resources.limits.memory }}
              cpu: {{ .Values.spark.master.resources.limits.cpu }}
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 7077
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master
  namespace: {{ include "stock-platform.namespace" . }}
  labels:
    app: spark-master
spec:
  type: ClusterIP
  ports:
    - port: 7077
      targetPort: spark
      name: spark
    - port: 8080
      targetPort: web-ui
      name: web-ui
  selector:
    app: spark-master
---
apiVersion: v1
kind: Service
metadata:
  name: spark-master-external
  namespace: {{ include "stock-platform.namespace" . }}
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: web-ui
      nodePort: 30080
      name: web-ui
  selector:
    app: spark-master
{{- end }}
