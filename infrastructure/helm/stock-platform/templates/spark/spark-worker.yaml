{{- if .Values.spark.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: {{ include "stock-platform.namespace" . }}
  labels:
    app: spark-worker
    {{- include "stock-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.spark.worker.replicas }}
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: spark-worker
          image: "{{ .Values.spark.image.repository }}:{{ .Values.spark.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - /opt/spark/bin/spark-class
          args:
            - org.apache.spark.deploy.worker.Worker
            - --webui-port
            - "8081"
            - spark://spark-master:7077
          ports:
            - containerPort: 8081
              name: web-ui
          env:
            - name: SPARK_WORKER_CORES
              value: "{{ .Values.spark.worker.cores }}"
            - name: SPARK_WORKER_MEMORY
              value: "{{ .Values.spark.worker.memory }}"
            - name: SPARK_WORKER_WEBUI_PORT
              value: "8081"
            - name: SPARK_HOME
              value: "/opt/spark"
          resources:
            requests:
              memory: {{ .Values.spark.worker.resources.requests.memory }}
              cpu: {{ .Values.spark.worker.resources.requests.cpu }}
            limits:
              memory: {{ .Values.spark.worker.resources.limits.memory }}
              cpu: {{ .Values.spark.worker.resources.limits.cpu }}
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
{{- end }}
