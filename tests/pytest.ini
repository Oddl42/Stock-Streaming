[pytest]
# ============================================================
# pytest Konfiguration – Stock Streaming Platform
# ============================================================

# Test-Verzeichnis
testpaths = tests

# Python-Dateien, die als Tests erkannt werden
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Standard-Optionen
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -ra
    --cov=backend
    --cov=frontend
    --cov-report=term-missing
    --cov-report=html:reports/coverage
    --cov-fail-under=70

# Marker-Definitionen
markers =
    unit: Unit Tests (schnell, ohne externe Abhängigkeiten)
    integration: Integration Tests (benötigen Docker Services)
    performance: Performance/Throughput Tests
    slow: Langsame Tests (>5s)
    kafka: Tests die Kafka benötigen
    database: Tests die TimescaleDB benötigen
    spark: Tests die Spark benötigen
    websocket: Tests die WebSocket benötigen
    gui: GUI-bezogene Tests

# Async-Modus für pytest-asyncio
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Timeout
timeout = 60

# Filter Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
